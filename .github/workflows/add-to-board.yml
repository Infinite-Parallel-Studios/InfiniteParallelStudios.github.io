# Copy this file to any repo in the Infinite-Parallel-Studios org as
# .github/workflows/add-to-board.yml — that is the entire per-repo step for
# getting new issues and PRs onto IPS Master Board.
#
# The logic lives in infinite-forge; this only forwards the event. See
# docs/board-auto-add.md for the two org-level prerequisites.

name: Add to board

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-board:
    # Secrets are not available to fork PRs, so skip rather than fail a run
    # nobody can fix. True for issue events, where this field does not exist.
    if: github.event.pull_request.head.repo.fork != true
    uses: Infinite-Parallel-Studios/infinite-forge/.github/workflows/add-to-board-reusable.yml@main
    secrets: inherit
    with:
      item_node_id: ${{ github.event.issue.node_id || github.event.pull_request.node_id }}
      item_ref: >-
        ${{ github.event_name == 'issues'
            && format('issue #{0} ({1})', github.event.issue.number, github.repository)
            || format('PR #{0} ({1})', github.event.pull_request.number, github.repository) }}
