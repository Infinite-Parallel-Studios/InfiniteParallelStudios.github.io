# ─────────────────────────────────────────────────────────────────────────────
# REPO-LOCAL. This file is deliberately NOT the org baseline verify.yml, and
# baseline/manifest.json skips this repo for that entry (infinite-forge).
#
# WHY THE BASELINE VERSION CANNOT WORK HERE
#
# The baseline verify.yml calls a reusable workflow from a PRIVATE repo:
#
#   uses: Infinite-Parallel-Studios/infinite-forge/.github/workflows/board-reusable.yml@main
#
# This repository is PUBLIC, and a public repository cannot use a reusable
# workflow from a private one. forge's workflow access level is
# `organization`, which shares it with other PRIVATE org repos and does not
# extend to public ones.
#
# GitHub rejects the whole file at load time rather than failing a job, so the
# run ended `failure` with ZERO jobs in ZERO seconds and NO `verify` check was
# ever produced. With `verify` a required status check org-wide, that left
# every PR here permanently blocked by a check that could never report.
#
# `if:` does not help: `uses:` is resolved when the workflow is loaded, before
# any condition is evaluated.
#
# WHAT THIS CHECKS, AND WHY IT IS REAL
#
# This is a Jekyll site (Gemfile, _config.yml, CNAME), so the honest check is
# the one the repo already declares for itself in pages-deploy.yml: build the
# site, then run html-proofer, which is already a `:test` group gem in the
# Gemfile. A broken Liquid tag, bad front matter, an invalid _config.yml or a
# dead internal link fails this — which is exactly what would break the
# published site.
#
# It is deliberately NOT a no-op that reports success. There is no package.json
# here, so the baseline's node path would have skipped everything and reported
# green on any change — protection that reads as real and is not.
#
# runs-on: ubuntu-latest, not the homelab runner. Two reasons, both binding:
# self-hosted runners must not serve a PUBLIC repo, because a fork PR would run
# arbitrary code on the box; and Actions minutes are free for public
# repositories, so the org's private-repo exhaustion does not apply here.
# ─────────────────────────────────────────────────────────────────────────────
name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job name IS the required check name. Do not rename it.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      # The same build the deploy runs. If this fails, the published site would
      # have failed too — which is the point of checking it before merge.
      - name: Build site
        run: bundle exec jekyll b -d _site
        env:
          JEKYLL_ENV: production

      # html-proofer is already a :test group gem in the Gemfile. External
      # links are disabled: a third-party outage is not a reason to block a
      # merge, and it would make this check fail by luck rather than by fault.
      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"
